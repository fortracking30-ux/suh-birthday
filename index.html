<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Suh! ✨</title>
  
  <!-- Tailwind CSS & Alpine.js via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fdf6f0;
      color: #4a2e35;
      overflow-x: hidden;
    }
    
    .font-serif-custom {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Floating Petals Canvas */
    #petals-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Flower Bloom & Split Transition */
    .flower-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      pointer-events: none;
    }

    .flower-half {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #f8bbd0, #f48fb1);
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flower-half-left { transform: translateX(0); }
    .flower-half-right { transform: translateX(0); }

    .bloom-open .flower-half-left { transform: translateX(-100%); }
    .bloom-open .flower-half-right { transform: translateX(100%); }

    /* 3D Card Flip */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* Glassmorphic Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 15px 35px rgba(224, 122, 148, 0.12);
    }

    /* Candle Flame Animation */
    .flame {
      width: 18px;
      height: 30px;
      background: radial-gradient(ellipse at bottom, #ffeb3b 0%, #ff9800 60%, #f44336 100%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
      animation: flicker 0.1s infinite alternate;
      margin: 0 auto;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); }
      100% { transform: scale(1.08) rotate(1deg); }
    }
  </style>
</head>
<body x-data="appData()" x-init="initApp()">

  <!-- Background Petals Canvas -->
  <canvas id="petals-canvas"></canvas>

  <!-- FLOWER BLOOM OVERLAY TRANSITION -->
  <div class="flower-layer" :class="{ 'bloom-open': flowerBloomed }">
    <div class="flower-half flower-half-left">
      <div class="text-white text-6xl transform translate-x-1/2 opacity-80">🌸</div>
    </div>
    <div class="flower-half flower-half-right">
      <div class="text-white text-6xl transform -translate-x-1/2 opacity-80">🌸</div>
    </div>
  </div>

  <main class="relative z-20 max-w-md mx-auto min-h-screen px-4 py-8 flex flex-col justify-center items-center">

    <!-- STEP 1: UNWRAPPING GIFT BOX SCREEN -->
    <template x-if="step === 'gift'">
      <div class="text-center cursor-pointer animate-bounce my-auto" @click="triggerGiftOpen()">
        <div class="text-8xl drop-shadow-lg">🎁</div>
        <h1 class="font-serif-custom text-3xl font-semibold text-pink-900 mt-6">A special surprise for you...</h1>
        <p class="text-sm text-pink-600 mt-2">(Tap the gift box to open)</p>
      </div>
    </template>

    <!-- STEP 2: LOCK / PASSKEY SCREEN -->
    <template x-if="step === 'lock'">
      <div class="glass-card w-full rounded-3xl p-6 text-center my-auto transition-all duration-500">
        <div class="text-4xl mb-2">🔒</div>
        <h2 class="font-serif-custom text-2xl font-bold text-pink-900">Enter Passkey</h2>
        <p class="text-xs text-pink-600 mt-1">Enter the secret 4-digit pin</p>

        <!-- PIN Dots -->
        <div class="flex justify-center gap-4 my-6">
          <template x-for="i in [0,1,2,3]">
            <div class="w-4 h-4 rounded-full border-2 border-pink-400 transition-all duration-300"
                 :class="{ 'bg-pink-500 shadow-lg shadow-pink-300': pin.length > i, 'bg-transparent': pin.length <= i }">
            </div>
          </template>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto">
          <template x-for="num in ['1','2','3','4','5','6','7','8','9']">
            <button @click="pressKey(num)" class="h-12 rounded-full bg-white text-lg font-semibold text-gray-800 shadow-sm active:bg-pink-100 transition">
              <span x-text="num"></span>
            </button>
          </template>
          <div></div>
          <button @click="pressKey('0')" class="h-12 rounded-full bg-white text-lg font-semibold text-gray-800 shadow-sm active:bg-pink-100 transition">0</button>
          <button @click="deleteKey()" class="h-12 rounded-full bg-white text-lg font-semibold text-pink-700 shadow-sm active:bg-pink-100 transition">⌫</button>
        </div>
      </div>
    </template>

    <!-- STEP 3: MAIN EXPERIENCE -->
    <template x-if="step === 'main'">
      <div class="w-full space-y-6 transition-all duration-700">

        <!-- HEADER & QUOTE CARD -->
        <div class="text-center py-4">
          <h1 class="font-serif-custom text-4xl font-bold text-pink-900">Happy Birthday, Suh! ✨</h1>
          <p class="font-serif-custom italic text-lg text-pink-700 mt-2">"Distance means so little when a friendship means so much."</p>
        </div>

        <!-- NEW FEATURE: MAKE A WISH & BLOW OUT CANDLE -->
        <div class="glass-card rounded-3xl p-6 text-center">
          <h2 class="font-serif-custom text-2xl font-semibold text-pink-900">Make a Wish 🎂</h2>
          <p class="text-xs text-pink-600 mb-4" x-text="candleBlown ? 'Your wish has been sent into the universe! ✨' : 'Close your eyes, make a wish, and blow into your mic (or tap below)'"></p>

          <div class="relative py-4 flex flex-col items-center justify-center">
            <!-- Candle Flame -->
            <div x-show="!candleBlown" class="flame transition-opacity duration-500"></div>
            <div x-show="candleBlown" class="text-xs text-gray-400 font-mono animate-pulse">💨 ~ puff ~</div>

            <!-- Candle Body -->
            <div class="w-4 h-16 bg-gradient-to-b from-pink-200 to-pink-400 rounded-sm shadow-inner mt-1"></div>
            
            <!-- Cupcake Base -->
            <div class="text-6xl -mt-2">🧁</div>
          </div>

          <div class="mt-3">
            <button x-show="!micActive && !candleBlown" @click="startMicBlow()" class="px-5 py-2 rounded-full bg-pink-500 text-white font-semibold text-xs shadow-md hover:bg-pink-600 transition">
              🎙️ Enable Mic to Blow
            </button>
            <button x-show="!candleBlown" @click="blowCandle()" class="ml-2 px-4 py-2 rounded-full bg-pink-100 text-pink-800 font-semibold text-xs hover:bg-pink-200 transition">
              💨 Tap to Blow Out
            </button>
            <div x-show="candleBlown" class="text-pink-800 font-serif-custom italic text-lg font-bold mt-2">
              🎉 May all your sweet wishes come true! 🎉
            </div>
          </div>
        </div>

        <!-- FEATURE 1: 3D POLAROID DECK WITH BACKSIDE MESSAGES -->
        <div class="glass-card rounded-3xl p-5 text-center">
          <h2 class="font-serif-custom text-2xl font-semibold text-pink-900">Favorite Moments 📸</h2>
          <p class="text-xs text-pink-600 mb-4">Tap photo to flip for a note, or swipe to reveal next</p>

          <div class="relative w-full h-80">
            <template x-for="(card, index) in cards" :key="index">
              <div x-show="!card.swiped"
                   class="absolute inset-0 transition-all duration-500 perspective-1000"
                   :style="'z-index: ' + (10 - index)">
                
                <div class="relative w-full h-full rounded-2xl transition-transform duration-700 transform-style-3d cursor-pointer"
                     :class="{ 'rotate-y-180': card.flipped }"
                     @click="card.flipped = !card.flipped">
                  
                  <!-- Front Side -->
                  <div class="absolute inset-0 bg-white p-3 rounded-2xl shadow-md flex flex-col justify-between items-center backface-hidden">
                    <div class="w-full h-3/4 rounded-xl overflow-hidden bg-pink-100">
                      <img :src="card.image" :alt="card.caption" class="w-full h-full object-cover">
                    </div>
                    <p class="font-serif-custom italic text-lg text-pink-900" x-text="card.caption"></p>
                    <button @click.stop="card.swiped = true" class="px-4 py-1 rounded-full bg-pink-200 text-pink-800 text-xs font-semibold hover:bg-pink-300">
                      Swipe ➔
                    </button>
                  </div>

                  <!-- Back Side -->
                  <div class="absolute inset-0 bg-pink-50 p-6 rounded-2xl shadow-md flex flex-col justify-center items-center text-center backface-hidden rotate-y-180">
                    <h3 class="font-serif-custom text-xl font-bold text-pink-900 mb-2" x-text="card.backTitle"></h3>
                    <p class="text-sm text-gray-700 leading-relaxed" x-text="card.backText"></p>
                  </div>

                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- FEATURE 2: SCROLLABLE HANDWRITTEN LETTER -->
        <div class="glass-card rounded-3xl p-6 text-left">
          <h2 class="font-serif-custom text-2xl font-bold text-center text-pink-900 mb-3">A Little Note From Me To You 📝</h2>
          <div class="space-y-3 text-sm text-gray-700 leading-relaxed max-h-60 overflow-y-auto pr-2">
            <p>Dear Suh,</p>
            <p>Writing this little note just because you deserve all the warmth and joy today! Thank you for being such an extraordinary friend, for sharing the best giggles, and for making conversations feel so easy and fun even from afar.</p>
            <p>I hope this year brings you infinite success, happiness, and all the sweet moments you've been wishing for. Stay the wonderful person you are!</p>
            <p class="font-serif-custom italic font-semibold text-pink-900 pt-2">— Always your friend ✨</p>
          </div>
        </div>

        <!-- FEATURE 3: VIRTUAL REASONS JAR -->
        <div class="glass-card rounded-3xl p-5 text-center cursor-pointer" @click="drawJarNote()">
          <h2 class="font-serif-custom text-2xl font-semibold text-pink-900">Jar of Virtual Reasons 🫙</h2>
          <p class="text-xs text-pink-600 mb-3">Tap the jar whenever you need a quick smile!</p>
          
          <div class="text-6xl mb-3 hover:scale-110 transition-transform">🫙</div>
          <div class="bg-white rounded-2xl p-4 border border-dashed border-pink-300 min-h-[70px] flex items-center justify-center">
            <p class="font-serif-custom italic text-pink-900 text-base" x-text="currentJarNote"></p>
          </div>
        </div>

        <!-- FEATURE 4: BIRTHDAY SCRATCH PERKS -->
        <div class="glass-card rounded-3xl p-5 text-center">
          <h2 class="font-serif-custom text-2xl font-semibold text-pink-900">Virtual Birthday Coupons 🎟️</h2>
          <p class="text-xs text-pink-600 mb-4">Scratch below to claim your birthday perks!</p>

          <div class="space-y-3">
            <template x-for="(coupon, idx) in coupons" :key="idx">
              <div class="relative w-full h-16 rounded-xl overflow-hidden bg-white shadow-sm flex items-center px-4 gap-3">
                <span class="text-2xl" x-text="coupon.icon"></span>
                <span class="text-xs font-semibold text-gray-800 text-left" x-text="coupon.text"></span>
                <canvas :id="'scratch-' + idx" class="absolute inset-0 w-full h-full cursor-pointer z-10"></canvas>
              </div>
            </template>
          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- Background Music Audio -->
  <audio id="bg-music" loop src="song.mp3"></audio>

  <script>
    function appData() {
      return {
        step: 'gift',
        flowerBloomed: false,
        pin: '',
        correctPin: '0910',
        candleBlown: false,
        micActive: false,
        currentJarNote: '"Tap the jar to pull out a note!"',
        
        jarNotes: [
          "✨ Your sense of humor always turns ordinary chats into the best conversations.",
          "🌸 You bring so much positive energy every single time we talk.",
          "✨ Thank you for being such a genuine, fun, and amazing friend.",
          "🌸 10/10 main character energy in every text!",
          "✨ Even across distance, your friendship means so much!"
        ],

        cards: [
          {
            image: 'photo1.jpg',
            caption: 'Endless Late Chats ✨',
            backTitle: 'A Special Note 💌',
            backText: 'Thank you for bringing so much brightness and spontaneous laughter into every single conversation!',
            flipped: false,
            swiped: false
          },
          {
            image: 'photo2.jpg',
            caption: 'Good Vibes Always 🌸',
            backTitle: 'Always Dependable 🌟',
            backText: 'Whether it\'s long conversations or quick catch-ups, chatting with you is always the best part of the day.',
            flipped: false,
            swiped: false
          },
          {
            image: 'photo3.jpg',
            caption: 'Main Character Energy 🤍',
            backTitle: 'Truly One of a Kind ✨',
            backText: 'Never lose your effortless charm, incredible sense of humor, and amazing vibe!',
            flipped: false,
            swiped: false
          }
        ],

        coupons: [
          { icon: '☕', text: 'Virtual Coffee & Late Night Gossip Session' },
          { icon: '🍔', text: 'Food Delivery Treat: Dinner On Me' },
          { icon: '🎬', text: 'Online Watch Party / Movie Night Pass' }
        ],

        triggerGiftOpen() {
          const music = document.getElementById('bg-music');
          if (music) music.play().catch(() => {});

          this.flowerBloomed = true;
          setTimeout(() => {
            this.step = 'lock';
            setTimeout(() => { this.flowerBloomed = false; }, 600);
          }, 800);
        },

        pressKey(num) {
          if (this.pin.length < 4) {
            this.pin += num;
            if (this.pin.length === 4) {
              setTimeout(() => this.checkPin(), 250);
            }
          }
        },

        deleteKey() {
          this.pin = this.pin.slice(0, -1);
        },

        checkPin() {
          if (this.pin === this.correctPin) {
            this.flowerBloomed = true;
            setTimeout(() => {
              this.step = 'main';
              setTimeout(() => {
                this.flowerBloomed = false;
                this.initScratchCards();
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
              }, 600);
            }, 800);
          } else {
            alert('Incorrect passkey! Try again.');
            this.pin = '';
          }
        },

        blowCandle() {
          if (!this.candleBlown) {
            this.candleBlown = true;
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
          }
        },

        async startMicBlow() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.micActive = true;
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            analyser.fftSize = 256;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            const detectBlow = () => {
              if (this.candleBlown) return;
              analyser.getByteFrequencyData(dataArray);
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
              let average = sum / dataArray.length;

              if (average > 45) { // Threshold for blow/loud sound
                this.blowCandle();
                stream.getTracks().forEach(track => track.stop());
              } else {
                requestAnimationFrame(detectBlow);
              }
            };
            detectBlow();
          } catch (err) {
            alert("Microphone access declined or unavailable. You can tap the button to blow!");
          }
        },

        drawJarNote() {
          const rand = this.jarNotes[Math.floor(Math.random() * this.jarNotes.length)];
          this.currentJarNote = `"${rand}"`;
        },

        initScratchCards() {
          this.$nextTick(() => {
            this.coupons.forEach((_, idx) => {
              const canvas = document.getElementById(`scratch-${idx}`);
              if (!canvas) return;

              const ctx = canvas.getContext('2d');
              canvas.width = canvas.offsetWidth;
              canvas.height = canvas.offsetHeight;

              ctx.fillStyle = '#f8bbd0';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.font = '12px Plus Jakarta Sans, sans-serif';
              ctx.fillStyle = '#8c3a50';
              ctx.textAlign = 'center';
              ctx.fillText('✨ Scratch to Reveal ✨', canvas.width / 2, canvas.height / 2 + 4);

              let isDrawing = false;
              const scratch = (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 16, 0, Math.PI * 2);
                ctx.fill();
              };

              ['mousedown', 'touchstart'].forEach(evt => canvas.addEventListener(evt, (e) => { isDrawing = true; scratch(e); }));
              ['mousemove', 'touchmove'].forEach(evt => canvas.addEventListener(evt, scratch));
              ['mouseup', 'touchend'].forEach(evt => canvas.addEventListener(evt, () => isDrawing = false));
            });
          });
        },

        initApp() {
          const canvas = document.getElementById('petals-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let width = canvas.width = window.innerWidth;
          let height = canvas.height = window.innerHeight;

          const petals = Array.from({ length: 22 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 6 + 4,
            speedY: Math.random() * 0.8 + 0.4,
            speedX: Math.random() * 0.4 - 0.2
          }));

          function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(248, 187, 208, 0.6)';
            petals.forEach(p => {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              p.y += p.speedY;
              p.x += p.speedX;
              if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
            });
            requestAnimationFrame(animate);
          }
          animate();
        }
      };
    }
  </script>
</body>
</html>
